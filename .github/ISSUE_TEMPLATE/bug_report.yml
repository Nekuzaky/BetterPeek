name: Bug report
description: Report something the container preview gets wrong.
title: "[bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please run through the checklist below before submitting.

  - type: checkboxes
    id: prereqs
    attributes:
      label: Prerequisites
      options:
        - label: I am using the latest release of BetterPeek.
          required: true
        - label: I am on Minecraft 1.21.11 with Fabric Loader 0.18.4+ and Fabric API.
          required: true
        - label: I searched existing issues and didn't find a duplicate.
          required: true

  - type: input
    id: mod-version
    attributes:
      label: BetterPeek version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did the bug happen?
      options:
        - Single-player
        - Multi-player (vanilla server)
        - Multi-player (Spigot / Paper)
        - Multi-player (Fabric server)
        - Realms
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / Arch Linux / macOS 14"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Be precise. "Open a chest, hover a shulker, look back at the chest" is good. "Doesn't work" is not.
      placeholder: |
        1. Open a creative world
        2. Place a chest, put a diamond in it, close
        3. Press V to toggle preview, look at the chest
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (`logs/latest.log` excerpt, especially errors)
      render: shell
    validations:
      required: false
